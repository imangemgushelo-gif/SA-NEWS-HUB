name: Daily Jobs Update

on:
  schedule:
    - cron: "0 4 * * *" # 06:00 SAST every day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-jobs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch jobs
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: node scripts/fetch-jobs.mjs
      - name: Commit updated jobs
        run: |
          git config user.name "SA News Hub Bot"
          git config user.email "bot@sanewshub.co.za"
          git add src/data/jobs.json
          git diff --cached --quiet || git commit -m "Auto-update jobs - $(date -u +%Y-%m-%d)"
          git push
